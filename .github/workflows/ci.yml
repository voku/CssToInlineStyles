name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-unit-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, simplexml
          coverage: xdebug
          tools: composer:v2.2

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Resolve and install test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run existing PHPUnit suite
        run: php vendor/bin/phpunit -c phpunit.xml

  runtime-smoke:
    name: Runtime smoke (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, simplexml
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Resolve runtime dependency graph without legacy PHPUnit
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      - name: Record the selected versions for Renovate review
        run: |
          composer show symfony/css-selector
          composer show voku/simple_html_dom

      - name: Check PHP source syntax
        run: find src -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Verify CSS conversion on the resolved dependency graph
        run: php tests/smoke.php
